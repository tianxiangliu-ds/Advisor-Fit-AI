name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖（含开发组）
        run: uv sync --group dev

      - name: 代码检查
        run: uv run ruff check src tests scripts app.py

      - name: 版本号一致性
        run: uv run python scripts/check_version.py

      - name: 自动测试
        run: uv run pytest -q

      - name: 离线评测
        run: uv run python scripts/run_evals.py
