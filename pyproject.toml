[project]
name = "advisor-fit-mvp"
version = "0.1.0"
description = "证据驱动的导师理解与匹配助手 MVP：单导师研究、人工身份确认、受控邮件草稿"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pypdf>=4.2",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
pdf = [
    "docling>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor_fit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_basetemp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
